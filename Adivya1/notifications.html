<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADIVYA | Notifications & Smart Alert Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="notification-page">
    <div class="notification-center-shell"
      ><header class="site-header compact-header">
        <nav class="navbar container" aria-label="Main navigation">
          <a class="brand" href="index.html" aria-label="ADIVYA home">
            <span class="brand-mark">🌱</span>
            <span>ADIVYA</span>
          </a>

          <div class="nav-group">
            <div class="nav-links">
              <a href="dashboard.html">Dashboard</a>
              <a href="opportunities.html">Opportunities</a>
              <a href="documents.html">Documents</a>
              <a href="journey.html">My Journey</a>
            </div>

            <div class="nav-actions">
              <button type="button" class="btn btn-secondary" id="backToDashboardBtn">Back to Dashboard</button>
            </div>
          </div>
        </nav>
      </header>

      <main class="container notification-center-page">
        <section class="notification-hero card">
          <div>
            <p class="eyebrow small">Smart Alert Center</p>
            <h1>Notifications & Smart Alert Center</h1>
            <p class="notification-subtitle">ADIVYA keeps your scholarship journey moving with time-sensitive guidance, document reminders, and action-ready alerts.</p>
          </div>
          <div class="notification-summary-grid">
            <div class="summary-stat">
              <span>Unread</span>
              <strong id="notificationSummaryUnread">0</strong>
            </div>
            <div class="summary-stat">
              <span>Urgent</span>
              <strong id="notificationSummaryUrgent">0</strong>
            </div>
            <div class="summary-stat">
              <span>Actions Ready</span>
              <strong id="notificationSummaryActions">0</strong>
            </div>
          </div>
        </section>

        <section class="notification-toolbar card">
          <div class="notification-filter-row" aria-label="Notification filters">
            <button type="button" class="filter-chip active" data-filter="all">All</button>
            <button type="button" class="filter-chip" data-filter="urgent">Urgent</button>
            <button type="button" class="filter-chip" data-filter="documents">Documents</button>
            <button type="button" class="filter-chip" data-filter="application">Application</button>
            <button type="button" class="filter-chip" data-filter="scholarship">Scholarship</button>
          </div>
          <button type="button" class="btn btn-primary small-btn" id="markAllReadBtn">Mark all as read</button>
        </section>

        <section class="notification-list-panel card">
          <div class="notification-list-header">
            <h2>Latest alerts</h2>
            <button type="button" class="btn btn-secondary small-btn" id="refreshNotificationsBtn">Refresh</button>
          </div>
          <div id="notificationCenterList" class="notification-center-list" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
